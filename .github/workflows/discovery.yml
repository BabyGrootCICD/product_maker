name: Discovery Pipeline

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run discovery pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: go run ./cmd/discovery run --config configs/pipeline.yaml

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discovery-output
          path: |
            out/opendata.json
            out/issues.json
            out/briefing.json
            out/digest.md
            tasks.md
          if-no-files-found: warn

      - name: Commit tasks.md
        run: |
          git config user.name "discovery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tasks.md
          if git diff --staged --quiet; then
            echo "tasks.md unchanged"
          else
            git commit -m "chore: refresh discovery tasks.md"
            git push
          fi

      - name: Create discovery branches via xAI
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          git config user.name "discovery-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          go run ./cmd/discovery branches --tasks tasks.md --top 3
